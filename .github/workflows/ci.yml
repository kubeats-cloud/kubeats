name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Placeholders. Nothing in the build talks to Supabase — every route is
      # rendered per request — but the env fail-fast is deliberately strict, so
      # the shape has to be there.
      #
      # SUPABASE_SERVICE_ROLE_KEY is intentionally NOT set: the integration
      # tests skip themselves without it, which is what keeps this pipeline
      # honest rather than running them against a real project from CI.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The deployable artefact, not just `next build`: this is the step that
      # catches an adapter-level break (a missing esbuild, an incompatible
      # Next version) here rather than on the host's build machine.
      - name: Build Worker
        run: npm run build
